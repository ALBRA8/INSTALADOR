# ============================================================
#  ALBRA Bootstrap MSI — build y release (GitHub Actions)
#
#  Produce el instalador nativo windows-x64 en un runner Windows:
#    1. Build standalone de INSTALADOR y PANEL (bun + Next.js)
#    2. Ensamblado del payload (node.exe verificado, WinSW pinneado,
#       templates de BD vía prisma db push) — msi/ci/assemble-payload.ps1
#    3. Compilación del MSI con WiX 5.0.2 — msi/build.ps1
#    4. Artifact siempre; GitHub Release con asset y línea
#       `albra-sha256:` SOLO en tags msi-v* (docs/GITHUB-SOURCES.md)
#
#  Disparos:
#    - workflow_dispatch (manual): versión y ref del PANEL opcionales
#    - push de tag msi-vX.Y.Z → release
# ============================================================
name: build-msi

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del MSI (sin v). Ej: 0.1.0"
        required: false
        default: "0.1.0"
      panel_ref:
        description: "Ref del repo PANEL-DE-CONTROL (branch/tag/sha)"
        required: false
        default: "main"
  push:
    tags:
      - "msi-v*"

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - name: Derivar versión
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#msi-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version || '0.1.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout INSTALADOR
        uses: actions/checkout@v4

      - name: Checkout PANEL-DE-CONTROL
        uses: actions/checkout@v4
        with:
          repository: ALBRA8/PANEL-DE-CONTROL
          ref: ${{ inputs.panel_ref || 'main' }}
          path: panel-repo

      - name: Node 22.14.0 (misma serie del runtime embebido)
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build standalone INSTALADOR
        shell: bash
        env:
          DATABASE_URL: file:./ci-build.db
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          bun install --frozen-lockfile
          npx prisma generate
          bun run build

      - name: Build standalone PANEL
        shell: bash
        working-directory: panel-repo
        env:
          DATABASE_URL: file:./ci-build.db
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          bun install --frozen-lockfile
          npx prisma generate
          bun run build

      - name: WiX Toolset 5.0.2
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Ensamblar payload
        shell: pwsh
        run: msi\ci\assemble-payload.ps1 -Version "${{ steps.ver.outputs.version }}" -PanelRepo "panel-repo"

      - name: Compilar MSI
        shell: pwsh
        run: msi\build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Evidencia SHA-256
        id: hash
        shell: pwsh
        run: |
          $msi = Get-Item "msi\dist\albra-installer-${{ steps.ver.outputs.version }}-windows-x64.msi"
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "hash=$hash"        >> $env:GITHUB_OUTPUT
          "size=$([math]::Round($msi.Length / 1MB, 2))" >> $env:GITHUB_OUTPUT
          Write-Host ""
          Write-Host "MSI:  $($msi.Name)  ($([math]::Round($msi.Length / 1MB, 2)) MB)"
          Write-Host "albra-sha256: $hash"

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: albra-installer-${{ steps.ver.outputs.version }}-windows-x64
          path: msi/dist/*.msi
          if-no-files-found: error

      - name: Release (solo tags msi-v*)
        if: startsWith(github.ref, 'refs/tags/msi-v')
        uses: softprops/action-gh-release@v2
        with:
          files: msi/dist/*.msi
          body: |
            ## ALBRA Bootstrap MSI ${{ steps.ver.outputs.version }} (windows-x64)

            ```
            albra-sha256: ${{ steps.hash.outputs.hash }}
            ```

            La cadena de confianza ALBRA rechaza assets sin checksum declarado
            (`docs/GITHUB-SOURCES.md`). Instalación: doble clic → servicios
            `AlbraCore` (127.0.0.1:3000) y `AlbraPanel` (127.0.0.1:3100) +
            acceso directo Inicio > ALBRA. Datos en `%ProgramData%\ALBRA`.

            ### Procedencia del build
            | Componente | Versión / fuente |
            |---|---|
            | WiX Toolset | 5.0.2 (pinneado) |
            | Node runtime embebido | v22.14.0 win-x64 (SHA-256 vs SHASUMS256.txt oficial) |
            | WinSW | v2.12.0 (pinneado, hash en log del build) |
            | PANEL-DE-CONTROL | `${{ inputs.panel_ref || 'main' }}` |
            | INSTALADOR | commit `${{ github.sha }}` |
